
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #b8cce5;
            text-align: center;
        }

        h1 {
            color: #2878c8;
        }

        p {
            color: #555;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 15px;
            background: #2878c8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #155a9e;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f6fc;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
        }

        li span {
            flex: 1;
            text-align: left;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: #e53935;
            padding: 8px 10px;
        }

        .clear-btn {
            background: #333;
            margin-top: 15px;
        }

        #message {
            color: #2878c8;
            font-size: 14px;
        }

        @media (max-width: 400px) {
            .container {
                padding: 18px;
            }

            .input-section {
                gap: 6px;
            }

            .input-section button {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🛒 Shopping List</h1>
        <p>Manage your shopping items easily!</p>

        <div class="input-section">
            <input type="text" id="itemInput"
                   placeholder="Enter an item...">
            <button onclick="addItem()">Add</button>
        </div>

        <p id="message"></p>

        <ul id="shoppingList"></ul>

        <button class="clear-btn" onclick="clearList()">
            Clear All
        </button>
    </div>

    <script>
        let items = JSON.parse(
            localStorage.getItem("shoppingItems") || "[]"
        );

        function saveItems() {
            localStorage.setItem(
                "shoppingItems",
                JSON.stringify(items)
            );
        }

        function displayItems() {
            const list = document.getElementById("shoppingList");
            list.innerHTML = "";

            items.forEach(function(item, index) {
                const li = document.createElement("li");

                const span = document.createElement("span");
                span.textContent = item.name;

                if (item.completed) {
                    span.classList.add("completed");
                }

                span.onclick = function() {
                    items[index].completed = !items[index].completed;
                    saveItems();
                    displayItems();
                };

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.onclick = function() {
                    items.splice(index, 1);
                    saveItems();
                    displayItems();
                    showMessage("Item deleted!");
                };

                li.appendChild(span);
                li.appendChild(deleteButton);
                list.appendChild(li);
            });
        }

        function addItem() {
            const input = document.getElementById("itemInput");
            const name = input.value.trim();

            if (name === "") {
                showMessage("Please enter an item!");
                input.focus();
                return;
            }

            items.push({
                name: name,
                completed: false
            });

            saveItems();
            displayItems();

            input.value = "";
            input.focus();

            showMessage("Item added successfully!");
        }

        function clearList() {
            if (items.length === 0) {
                showMessage("Your list is already empty!");
                return;
            }

            if (confirm("Are you sure you want to clear all items?")) {
                items = [];
                saveItems();
                displayItems();
                showMessage("Shopping list cleared!");
            }
        }

        function showMessage(message) {
            document.getElementById("message").textContent = message;
        }

        document.getElementById("itemInput").addEventListener(
            "keydown", function(event) {
                if (event.key === "Enter") {
                    addItem();
                }
            }
        );

        displayItems();
    </script>

</body>
</html>
